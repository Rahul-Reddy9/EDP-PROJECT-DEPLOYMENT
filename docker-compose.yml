version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - API_BASE_URL=http://localhost:8000
      - REVOCATION_DB_PATH=/app/data/revoked_tokens.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-fraudguard_production_secret_key_change_in_env_file_32bytes}
    volumes:
      - fraudguard-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fraudguard-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudguard-frontend
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fraudguard-net

  # Optional distributed cache for horizontal multi-replica token revocation
  # redis:
  #   image: redis:7-alpine
  #   container_name: fraudguard-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - fraudguard-net

volumes:
  fraudguard-data:
    driver: local

networks:
  fraudguard-net:
    driver: bridge
